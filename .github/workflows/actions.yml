name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      env:
        CC: gcc
        CXX: g++
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
    - name: Test with pytest
      run: pytest
    - name: Run geometry demos
      env:
        MPLBACKEND: Agg
      run: |
        python examples/f_spline_ship_section.py --output /tmp/f_spline.png
        python examples/first_principles_fspline_hull.py
        python examples/f_surface_global_solve.py
        python examples/dtmb_5415_validation.py --output /tmp/dtmb_5415.png
