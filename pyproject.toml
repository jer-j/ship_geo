[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ship_geo"
version = "0.1.0"
description = "Differentiable, first-principles ship geometry built on CSDL and B-splines."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE.txt"}
keywords = [
    "ship design",
    "geometry",
    "B-splines",
    "F-splines",
    "multidisciplinary design optimization",
]
authors = [
    {name = "Andrew Fletcher", email = "afletcher168@gmail.com"},
    {name = "Jeremy John"},
]
dependencies = [
    # numpy is held at 1.x because lsdo_b_splines_cython's extension modules
    # are built against that ABI.
    "numpy>=1.24,<2",
    # These three are pinned to commits that work together. Taking them at
    # HEAD is not safe: a build from HEAD on 2026-09-05 switched
    # lsdo_function_spaces.BSplineSpace to a non-Cython implementation that
    # imports csdl_alpha.experimental.CustomExplicitOperationBeta, which the
    # matching csdl_alpha does not define, so the package raises at import.
    # Move the pins deliberately, together, and re-run the tests.
    "csdl_alpha @ git+https://github.com/LSDOlab/CSDL_alpha.git@6540b02ce3817a9e2cdf89ffb83261db84e703b4",
    "lsdo_function_spaces @ git+https://github.com/LSDOlab/lsdo_function_spaces.git@a021f30821d6dc1f6de55e33bab9fcbc94520855",
    "lsdo_b_splines_cython @ git+https://github.com/LSDOlab/lsdo_b_splines_cython.git@9444ea81f6fc58dabd68559323b13f0d549a383d",
    "vedo",
    "pyvista",
    "joblib",
    "pandas",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "matplotlib>=3.8",
]
docs = [
    "myst-nb",
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinx-autoapi",
    "sphinxcontrib-bibtex",
    "numpydoc",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["lsdo_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning:csdl_alpha.*",
    "ignore:invalid escape sequence.*:DeprecationWarning:lsdo_function_spaces.*",
]
