[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ship_geo"
version = "0.1.0"
description = "Differentiable, first-principles ship geometry built on CSDL and B-splines."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE.txt"}
keywords = [
    "ship design",
    "geometry",
    "B-splines",
    "F-splines",
    "multidisciplinary design optimization",
]
authors = [
    {name = "Andrew Fletcher", email = "afletcher168@gmail.com"},
    {name = "Jeremy John"},
]
dependencies = [
    "numpy>=1.24",
    "csdl_alpha @ git+https://github.com/LSDOlab/CSDL_alpha.git",
    "lsdo_function_spaces @ git+https://github.com/LSDOlab/lsdo_function_spaces.git",
    "lsdo_b_splines_cython @ git+https://github.com/LSDOlab/lsdo_b_splines_cython.git",
    "vedo",
    "pyvista",
    "joblib",
    "pandas",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "matplotlib>=3.8",
    "jax[cpu]>=0.4.30,<0.5",
]
docs = [
    "myst-nb",
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinx-autoapi",
    "sphinxcontrib-bibtex",
    "numpydoc",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["lsdo_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning:csdl_alpha.*",
    "ignore:invalid escape sequence.*:DeprecationWarning:lsdo_function_spaces.*",
]
